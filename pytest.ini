[pytest]
markers =
    integration: pruebas que arrancan la app completa contra la BD de test (SQLite).
# Config compartida del monorepo: los servicios NO tienen pytest.ini propio, así que
# heredan estos markers al correr `pytest` desde su carpeta (pytest sube hasta aquí).
#
# Cada servicio es un proyecto aparte con su propio main.py, container.py y conftest,
# y todos definen un paquete llamado `app`. Recolectarlos juntos desde la raíz choca
# por nombre de paquete: de ahí el norecursedirs. Se prueban uno por uno:
#   cd service_pagos && ..\.venv\Scripts\python -m pytest
norecursedirs = .* build dist CVS _darcs *.egg node_modules venv .venv service_* shared_core
